name: windows-smoke

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Install npm dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Smoke-test packed CLI artifact
        run: node scripts/packed-cli-smoke.mjs

      - name: Run lazypi --yes
        run: node bin/lazypi.mjs --yes

      - name: Assert expected packages
        run: node scripts/assert-installed-packages.mjs --check-status

      - name: Doctor passes on Windows
        run: node bin/lazypi.mjs doctor
